{% extends "base.html" %}
{% block body %}
<div class="px-5 pt-5 pb-16">
  <a href="{% url 'core:home' %}" class="inline-flex items-center gap-2 text-gray-500 text-sm mb-4">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>Retour</a>
  <h1 class="text-2xl font-extrabold text-gray-900">{% block legal_title %}{% endblock %}</h1>
  <p class="text-gray-400 text-sm mt-1">Dernière mise à jour : {{ updated }}</p>
  <div class="prose prose-sm mt-5 text-gray-600 space-y-4 [&_h2]:font-bold [&_h2]:text-gray-900 [&_h2]:mt-5 [&_h2]:text-base [&_p]:leading-relaxed">
    {% block legal_body %}{% endblock %}
  </div>
  <div class="mt-8 flex flex-wrap gap-2 text-xs">
    <a href="{% url 'core:legal' 'cgu' %}" class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">CGU</a>
    <a href="{% url 'core:legal' 'confidentialite' %}" class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Confidentialité</a>
    <a href="{% url 'core:legal' 'cgv' %}" class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">CGV</a>
    <a href="{% url 'core:legal' 'mentions' %}" class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Mentions légales</a>
  </div>
</div>
{% endblock %}
