{% extends "client/base.html" %}
{% block title %}Notifications — ONE EAT{% endblock %}
{% block content %}
<div class="px-4 pt-5">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-extrabold text-gray-900">Notifications</h1>
    <button onclick="OE.enablePush('{{ VAPID_PUBLIC_KEY }}')" class="text-xs font-bold text-brand bg-brand-50 px-3 py-1.5 rounded-full">🔔 Activer</button>
  </div>
</div>
<div class="px-4 mt-4 space-y-2">
  {% for n in notifications %}
  <a href="{{ n.url|default:'#' }}" class="flex gap-3 p-4 rounded-2xl {% if not n.is_read %}bg-brand-50{% else %}bg-gray-50{% endif %}">
    <div class="w-10 h-10 rounded-full bg-brand text-white flex items-center justify-center flex-shrink-0">🔔</div>
    <div class="flex-1 min-w-0">
      <p class="font-bold text-gray-900 text-sm">{{ n.title }}</p>
      <p class="text-gray-500 text-sm mt-0.5">{{ n.body }}</p>
      <p class="text-gray-400 text-xs mt-1">{{ n.created_at|timesince }}</p>
    </div>
  </a>
  {% empty %}
  <div class="text-center py-20"><div class="text-6xl">🔔</div><p class="mt-4 text-gray-500">Aucune notification</p></div>
  {% endfor %}
</div>
{% endblock %}
