{% load static %}
{% with active=request.resolver_match.url_name %}
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-gray-100 z-40"
     style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="grid grid-cols-4 h-[68px]">
    <a href="{% url 'core:home' %}" class="flex flex-col items-center justify-center gap-1 {% if active == 'home' %}text-brand{% else %}text-gray-400{% endif %}">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.5 1.5 0 012.122 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/></svg>
      <span class="text-[11px] font-medium">Accueil</span>
    </a>
    <a href="{% url 'core:explore' %}" class="flex flex-col items-center justify-center gap-1 {% if active == 'explore' %}text-brand{% else %}text-gray-400{% endif %}">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      <span class="text-[11px] font-medium">Explorer</span>
    </a>
    <a href="{% url 'orders:cart' %}" class="relative flex flex-col items-center justify-center gap-1 {% if active == 'cart' %}text-brand{% else %}text-gray-400{% endif %}">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z"/></svg>
      <span class="text-[11px] font-medium">Panier</span>
      <span id="nav-cart-badge" class="absolute top-2 right-[22%] min-w-[18px] h-[18px] px-1 rounded-full bg-brand text-white text-[10px] font-bold flex items-center justify-center {% if not cart_count %}hidden{% endif %}">{{ cart_count }}</span>
    </a>
    <a href="{% if user.is_authenticated %}{% url 'accounts:profile' %}{% else %}{% url 'accounts:login' %}{% endif %}"
       class="flex flex-col items-center justify-center gap-1 {% if active == 'profile' %}text-brand{% else %}text-gray-400{% endif %}">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 19.5a7.5 7.5 0 0115 0v.75H4.5v-.75z"/></svg>
      <span class="text-[11px] font-medium">Profil</span>
    </a>
  </div>
</nav>
{% endwith %}
