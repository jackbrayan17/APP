{% load static %}
{% with active=request.resolver_match.url_name %}
{# Bouton panier flottant : visible des qu'il y a des articles #}
<a id="cart-fab" href="{% url 'orders:cart' %}"
   class="fixed left-1/2 -translate-x-1/2 bottom-[calc(80px+env(safe-area-inset-bottom))] z-40 w-[calc(100%-32px)] max-w-[448px] h-14 rounded-2xl bg-gray-900 text-white shadow-2xl shadow-black/25 flex items-center justify-between px-4 {% if not cart_count or active == 'cart' or active == 'dish_detail' or active == 'payment' %}hidden{% endif %}">
  <span class="flex items-center gap-3">
    <span id="cart-fab-count" class="min-w-[28px] h-7 px-2 rounded-lg bg-brand text-sm font-extrabold flex items-center justify-center">{{ cart_count }}</span>
    <span class="font-bold text-[15px]">Voir le panier</span>
  </span>
  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
</a>

<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white/95 backdrop-blur border-t border-gray-100 z-40"
     style="padding-bottom:env(safe-area-inset-bottom)" aria-label="Navigation principale">
  <div class="grid grid-cols-5 h-[68px]">
    <a href="{% url 'core:home' %}" class="flex flex-col items-center justify-center gap-1 {% if active == 'home' %}text-brand{% else %}text-gray-400{% endif %}">
      <svg class="w-6 h-6" fill="{% if active == 'home' %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.5 1.5 0 012.122 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/></svg>
      <span class="text-[11px] font-semibold">Accueil</span>
    </a>
    <a href="{% url 'core:explore' %}" class="flex flex-col items-center justify-center gap-1 {% if active == 'explore' %}text-brand{% else %}text-gray-400{% endif %}">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="{% if active == 'explore' %}2.4{% else %}1.8{% endif %}" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      <span class="text-[11px] font-semibold">Explorer</span>
    </a>
    <a href="{% url 'core:dietetique' %}" class="flex flex-col items-center justify-center gap-1 {% if active == 'dietetique' %}text-emerald-600{% else %}text-gray-400{% endif %}">
      <svg class="w-6 h-6" fill="{% if active == 'dietetique' %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21c-4.97 0-8-3.58-8-8 0-5 4-9 12-10-1 8-5 12-10 13m6 5c0-4 1-7 4-10"/></svg>
      <span class="text-[11px] font-semibold">Diète</span>
    </a>
    <a href="{% if user.is_authenticated %}{% url 'orders:list' %}{% else %}{% url 'accounts:login' %}?next=/commandes/{% endif %}" class="relative flex flex-col items-center justify-center gap-1 {% if active == 'list' or active == 'detail' %}text-brand{% else %}text-gray-400{% endif %}">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg>
      <span class="text-[11px] font-semibold">Commandes</span>
      {% if active_order_count %}<span class="absolute top-2 right-[24%] w-2.5 h-2.5 rounded-full bg-brand ring-2 ring-white pulse-ring"></span>{% endif %}
    </a>
    <a href="{% if user.is_authenticated %}{% url 'accounts:profile' %}{% else %}{% url 'accounts:login' %}{% endif %}"
       class="flex flex-col items-center justify-center gap-1 {% if active == 'profile' or active == 'favorites' %}text-brand{% else %}text-gray-400{% endif %}">
      <svg class="w-6 h-6" fill="{% if active == 'profile' %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 19.5a7.5 7.5 0 0115 0v.75H4.5v-.75z"/></svg>
      <span class="text-[11px] font-semibold">Profil</span>
    </a>
  </div>
</nav>
<span id="nav-cart-badge" class="hidden">{{ cart_count }}</span>
{% endwith %}
