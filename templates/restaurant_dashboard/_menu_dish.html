{% load humanize %}
<div class="flex items-center gap-3 rounded-2xl border border-gray-100 bg-white p-3">
  <div class="h-14 w-14 flex-shrink-0 overflow-hidden rounded-xl bg-gray-100">{% if dish.image %}<img src="{{ dish.image.url }}" class="h-full w-full object-cover" alt="" loading="lazy">{% endif %}</div>
  <button type="button" @click="modify({{ dish.id }})" class="min-w-0 flex-1 text-left">
    <p class="truncate text-sm font-semibold text-gray-900">{{ dish.name }}</p>
    <p class="text-xs text-gray-500 tabular">{{ dish.price|intcomma }} FCFA · {{ dish.prep_time }} min{% if dish.calories %} · {{ dish.calories }} kcal{% endif %}{% if dish.is_diet %} · <span class="font-semibold text-emerald-600">Diète</span>{% endif %}</p>
  </button>
  <button type="button" @click="toggle({{ dish.id }}, $el)" data-on="{% if dish.is_available %}1{% else %}0{% endif %}" role="switch"
          class="group relative h-7 w-12 flex-shrink-0 rounded-full bg-gray-200 transition data-[on='1']:bg-emerald-500" aria-label="Disponibilité de {{ dish.name }}">
    <span class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition group-data-[on='1']:translate-x-5"></span>
  </button>
  <form method="post" action="{% url 'restaurants:dish_delete' dish.id %}" onsubmit="return confirm('Supprimer définitivement ce plat ?')">{% csrf_token %}
    <button class="p-1.5 text-gray-300 hover:text-red-500" aria-label="Supprimer"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg></button>
  </form>
</div>
