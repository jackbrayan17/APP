name: CI / CD FTP deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  EMAIL_RECIPIENT: jackbrayan1707@gmail.com
  MAIL_FROM: "ONE EAT CI <noreply@oneeat.cm>"
  CPANEL_REMOTE_DIR: "oneeat"
  REMOTE_APP_DIR: "/home/ch6973134ef1cfd/oneeat"

jobs:
  test:
    name: Run Django tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django test suite
        run: python manage.py test

  deploy:
    name: Deploy to cPanel
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: ONE EAT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          echo "${{ github.sha }}" > RELEASE
          zip -rq oneeat-release.zip . \
            -x ".git/*" ".git/**" ".github/*" ".github/**" \
               ".claude/*" ".claude/**" ".kilo/*" ".kilo/**" ".sixth/*" ".sixth/**" \
               "mobile/*" "mobile/**" "db.sqlite3" "*.log" "media.zip" \
               "tmp/*" "tmp/**" "*/__pycache__/*" "*/__pycache__/**" "*.pyc"

      - name: Deploy archive via cPanel API
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          import urllib.parse
          import requests

          host = os.environ["CPANEL_HOST"]
          user = os.environ["CPANEL_USER"]
          token = os.environ["CPANEL_API_TOKEN"]
          remote_dir = os.environ["CPANEL_REMOTE_DIR"]
          archive = "oneeat-release.zip"
          auth = {"Authorization": f"cpanel {user}:{token}"}
          base = f"https://{host}:2083"

          with open(archive, "rb") as fh:
              response = requests.post(
                  f"{base}/execute/Fileman/upload_files",
                  headers=auth,
                  data={"dir": f"/home/{user}"},
                  files={"file-1": ("oneeat-release.zip", fh, "application/zip")},
                  timeout=180,
              )
          response.raise_for_status()
          upload = response.json()
          if upload.get("status") != 1:
              print(upload)
              sys.exit("cPanel upload failed")

          params = {
              "cpanel_jsonapi_user": user,
              "cpanel_jsonapi_apiversion": "2",
              "cpanel_jsonapi_module": "Fileman",
              "cpanel_jsonapi_func": "fileop",
              "op": "extract",
              "sourcefiles": "oneeat-release.zip",
              "destfiles": remote_dir,
              "doubledecode": "1",
          }
          extract = requests.get(
              f"{base}/json-api/cpanel?{urllib.parse.urlencode(params)}",
              headers=auth,
              timeout=180,
          )
          extract.raise_for_status()
          data = extract.json()
          result = data.get("cpanelresult", {}).get("event", {}).get("result")
          if result != 1:
              print(data)
              sys.exit("cPanel archive extraction failed")
          print("cPanel archive uploaded and extracted.")

          # Redemarrage Passenger : migrations + catalogue appliques au boot (oneeat/release.py)
          restart = requests.post(
              f"{base}/execute/Fileman/save_file_content",
              headers=auth,
              data={"dir": f"/home/{user}/{remote_dir}/tmp", "file": "restart.txt",
                    "content": os.environ.get("GITHUB_SHA", "restart")},
              timeout=60,
          )
          restart.raise_for_status()
          if restart.json().get("status") != 1:
              print(restart.json())
              sys.exit("Passenger restart request failed")
          print("Passenger restart requested.")
          PY

      - name: Verify the live site
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://oneeat.cm/dietetique/ || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Live site did not answer 200 on /dietetique/"
          exit 1

      - name: Run remote Django maintenance commands
        if: ${{ env.SSH_HOST != '' && env.SSH_USERNAME != '' && (env.SSH_PRIVATE_KEY != '' || env.SSH_PASSWORD != '') }}
        uses: appleboy/ssh-action@v0.1.8
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd "${{ env.REMOTE_APP_DIR }}"

            if [ -n "${{ secrets.REMOTE_VENV_ACTIVATE }}" ]; then
              source "${{ secrets.REMOTE_VENV_ACTIVATE }}"
            elif [ -f ./venv/bin/activate ]; then
              source ./venv/bin/activate
            elif [ -f ./env/bin/activate ]; then
              source ./env/bin/activate
            fi

            python manage.py migrate --noinput || exit 1
            python manage.py collectstatic --noinput || exit 1

            mkdir -p tmp
            touch tmp/restart.txt || true

  rollback:
    name: Rollback to previous stable commit
    needs: deploy
    if: needs.deploy.result == 'failure'
    environment: ONE EAT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout previous commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}

      - name: Build rollback archive
        run: |
          zip -rq oneeat-release.zip . \
            -x ".git/*" ".git/**" ".github/*" ".github/**" \
               ".claude/*" ".claude/**" ".kilo/*" ".kilo/**" ".sixth/*" ".sixth/**" \
               "mobile/*" "mobile/**" "db.sqlite3" "*.log" "media.zip" \
               "tmp/*" "tmp/**" "*/__pycache__/*" "*/__pycache__/**" "*.pyc"

      - name: Deploy previous stable commit via cPanel API
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          import urllib.parse
          import requests

          host = os.environ["CPANEL_HOST"]
          user = os.environ["CPANEL_USER"]
          token = os.environ["CPANEL_API_TOKEN"]
          remote_dir = os.environ["CPANEL_REMOTE_DIR"]
          auth = {"Authorization": f"cpanel {user}:{token}"}
          base = f"https://{host}:2083"

          with open("oneeat-release.zip", "rb") as fh:
              response = requests.post(
                  f"{base}/execute/Fileman/upload_files",
                  headers=auth,
                  data={"dir": f"/home/{user}"},
                  files={"file-1": ("oneeat-release.zip", fh, "application/zip")},
                  timeout=180,
              )
          response.raise_for_status()
          upload = response.json()
          if upload.get("status") != 1:
              print(upload)
              sys.exit("cPanel rollback upload failed")

          params = {
              "cpanel_jsonapi_user": user,
              "cpanel_jsonapi_apiversion": "2",
              "cpanel_jsonapi_module": "Fileman",
              "cpanel_jsonapi_func": "fileop",
              "op": "extract",
              "sourcefiles": "oneeat-release.zip",
              "destfiles": remote_dir,
              "doubledecode": "1",
          }
          extract = requests.get(
              f"{base}/json-api/cpanel?{urllib.parse.urlencode(params)}",
              headers=auth,
              timeout=180,
          )
          extract.raise_for_status()
          data = extract.json()
          result = data.get("cpanelresult", {}).get("event", {}).get("result")
          if result != 1:
              print(data)
              sys.exit("cPanel rollback extraction failed")
          print("Rollback archive uploaded and extracted.")
          PY

  notify:
    name: Send status email
    needs:
      - test
      - deploy
      - rollback
    if: always()
    environment: ONE EAT
    runs-on: ubuntu-latest
    steps:
      - name: Validate SMTP secrets
        run: |
          if [[ -z "${{ secrets.SMTP_SERVER }}" || -z "${{ secrets.SMTP_PORT }}" || -z "${{ secrets.SMTP_USERNAME }}" || -z "${{ secrets.SMTP_PASSWORD }}" ]]; then
            echo "SMTP secrets are missing or empty. Please add SMTP_SERVER, SMTP_PORT, SMTP_USERNAME and SMTP_PASSWORD to GitHub secrets."
            exit 1
          fi

      - name: Set email secure flag
        id: mail_secure
        run: |
          if [[ -z "${{ secrets.SMTP_SECURE }}" ]]; then
            echo "secure=false" >> "$GITHUB_OUTPUT"
          else
            echo "secure=${{ secrets.SMTP_SECURE }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build email content
        id: build_message
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            STATUS="ECHEC"
            DETAILS="Le job de tests a échoué."
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            STATUS="ECHEC"
            DETAILS="Le déploiement a échoué et un rollback vers le commit précédent a été tenté."
          elif [[ "${{ needs.rollback.result }}" == "success" && "${{ needs.deploy.result }}" == "failure" ]]; then
            STATUS="RECUPERATION"
            DETAILS="Le déploiement initial a échoué, mais le rollback vers le commit précédent a réussi."
          else
            STATUS="SUCCES"
            DETAILS="Les tests ont réussi et le déploiement FTP a été effectué avec succès."
          fi

          SUBJECT="[ONE EAT] CI/CD - $STATUS pour ${{ github.repository }}"
          BODY="Bonjour Jack,\n\nLe workflow GitHub Actions pour le projet ONE EAT s'est terminé.\n\nStatut général : $STATUS\nRéférence Git : ${{ github.ref }}\nÉvénement : ${{ github.event_name }}\nRésultat des tests : ${{ needs.test.result }}\nRésultat du déploiement : ${{ needs.deploy.result }}\nRésultat du rollback : ${{ needs.rollback.result }}\n\n$DETAILS\n\nCommit : ${{ github.sha }}\nURL du workflow : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nCordialement,\nONE EAT CI/CD\n"

          BODY_HTML="<html><body style='font-family:Arial,sans-serif;color:#333;margin:0;padding:0'>\n  <div style='max-width:600px;margin:20px auto;padding:20px;border-radius:6px;border:1px solid #eee;background:#fff'>\n    <h2 style='color:#FF6B1A;margin-bottom:6px'>ONE EAT — CI/CD</h2>\n    <p style='font-size:15px'>Statut général : <strong style='color:#111'>$STATUS</strong></p>\n    <p style='background:#f9f9f9;padding:12px;border-radius:4px;color:#222'>$DETAILS</p>\n    <ul style='color:#444;font-size:13px;line-height:1.4'>\n      <li>Référence Git : ${{ github.ref }}</li>\n      <li>Événement : ${{ github.event_name }}</li>\n      <li>Tests : <strong>${{ needs.test.result }}</strong></li>\n      <li>Déploiement : <strong>${{ needs.deploy.result }}</strong></li>\n      <li>Commit : <code style='background:#f1f1f1;padding:2px 4px;border-radius:3px'>${{ github.sha }}</code></li>\n    </ul>\n    <p style='text-align:center;margin-top:18px'>\n      <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' style='display:inline-block;padding:10px 16px;background:#FF6B1A;color:#fff;text-decoration:none;border-radius:4px'>Voir le workflow</a>\n    </p>\n    <hr style='border:none;border-top:1px solid #eee;margin:18px 0'/>\n    <p style='font-size:12px;color:#777'>Cordialement,<br/>ONE EAT CI/CD</p>\n  </div>\n</body></html>"

          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          echo "body_html<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY_HTML" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.build_message.outputs.subject }}
          body: ${{ steps.build_message.outputs.body }}
          body_html: ${{ steps.build_message.outputs.body_html }}
          content_type: text/html
          to: ${{ env.EMAIL_RECIPIENT }}
          from: ${{ env.MAIL_FROM }}
          secure: ${{ steps.mail_secure.outputs.secure }}
